{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <title>{% block title %}My ebooking — Histoires à partager{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'catalog/site.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'catalog' %}"><span class="brand-mark">m</span> my ebooking</a>
    <nav aria-label="Navigation principale">
      <a href="{% url 'catalog' %}">Les livres</a>
      <a class="nav-cta" href="{% url 'catalog' %}#catalogue">Explorer</a>
    </nav>
  </header>
  <main>
    {% if messages %}
      <div class="messages" role="status">
        {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a class="brand" href="{% url 'catalog' %}"><span class="brand-mark">m</span> my ebooking</a>
    <p>De belles histoires, à lire et à relire.</p>
  </footer>
</body>
</html>
